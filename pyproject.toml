[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcity-student-kit"
version = "0.1.0"
description = "Cliente Python para la API REST del simulador SmartCity Donostia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.urls]
Simulador = "https://github.com/prubioamzubiri/SmartCity"

[tool.setuptools.packages.find]
where = ["src"]
